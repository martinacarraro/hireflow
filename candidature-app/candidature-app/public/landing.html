<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le faremo sapere — Job Tracker</title>
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a12;
      --purple: #7B2FFF;
      --pink: #FF2D8B;
      --txt: #f0f0ff;
      --muted: rgba(240,240,255,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", sans-serif; background: var(--bg); color: var(--txt); line-height: 1.5; }

    /* NAV */
    nav {
      position: fixed; top: 0; width: 100%; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 25px; background: rgba(10,10,18,0.9); backdrop-filter: blur(10px);
    }
    .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; }
    .logo-img { width: 35px; height: 35px; border-radius: 8px; }

    /* HERO - RISOLTO IL BUCO NERO */
    .hero {
      padding: 120px 20px 60px; /* Ridotto il padding per eliminare lo spazio vuoto */
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-size: clamp(32px, 7vw, 64px); line-height: 1.1; margin-bottom: 20px;
    }
    .hero h1 em { font-style: normal; color: var(--pink); }
    .hero p { font-size: 18px; color: var(--muted); margin-bottom: 30px; }

    /* BUTTONS */
    .btn {
      display: inline-block; padding: 14px 28px; border-radius: 50px;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color: white; font-weight: 700; text-decoration: none; transition: 0.3s;
    }
    .btn:hover { transform: scale(1.05); }

    /* PHONES SECTION */
    .phones-preview {
      display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
      padding-bottom: 80px;
    }
    .mockup {
      width: 250px; height: 500px; border: 8px solid #1f1f2e; border-radius: 30px;
      background: #13131f; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="logo-container">
      <img src="icon-512.png" alt="Ghost Logo" class="logo-img">
      <span style="font-family:'Bricolage Grotesque'; font-weight:800">Le faremo sapere</span>
    </a>
    <a href="#join" class="btn" style="padding: 8px 16px; font-size: 14px">Inizia</a>
  </nav>

  <section class="hero">
    <h1>Quante volte ti hanno detto <em>"le faremo sapere"?</em></h1>
    <p>Smetti di rincorrere le email. Traccia ogni candidatura, gestisci i colloqui e analizza la tua ricerca in un unico posto. 👻</p>
    <a href="#join" class="btn">🚀 Richiedi l'accesso anticipato</a>
  </section>

  <section class="phones-preview">
    <div class="mockup">
       <div style="padding:20px; text-align:center; color:var(--muted); font-size:12px; margin-top:50%">Mockup Home</div>
    </div>
    <div class="mockup" style="transform: translateY(-20px)">
       <div style="padding:20px; text-align:center; color:var(--muted); font-size:12px; margin-top:50%">Mockup Calendario</div>
    </div>
  </section>

</body>
</html>
